name: Try Linux package

on:
  push:
    branches: [feat/linux]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:linux
      - name: List packages
        run: echo "::warning title=packages::$(cd packages/desktop/dist && ls *.AppImage *.deb | tr '\n' ' ')"
      - name: Extract AppImage
        working-directory: packages/desktop/dist
        run: |
          chmod +x Antumi-*.AppImage
          ./Antumi-*.AppImage --appimage-extract > /dev/null
          ls squashfs-root squashfs-root/resources/backend
      - name: Spawn a PTY with the packaged node-pty
        working-directory: packages/desktop/dist/squashfs-root
        run: |
          exe=$(find . -maxdepth 1 -type f -executable -name 'antumi*' | head -1)
          echo "::warning title=executable::$exe"
          ELECTRON_RUN_AS_NODE=1 "$exe" -e "
            const pty = require('./resources/backend/node_modules/node-pty');
            let out = '';
            const p = pty.spawn('/bin/sh', ['-c', 'echo pty-ok'], {});
            p.onData((d) => { out += d });
            p.onExit(() => { console.log(out.trim()); process.exit(out.includes('pty-ok') ? 0 : 1) });
          "
      - name: Start the packaged daemon bundle
        working-directory: packages/desktop/dist/squashfs-root
        run: |
          exe=$(find . -maxdepth 1 -type f -executable -name 'antumi*' | head -1)
          export ANTUMI_HOME="$RUNNER_TEMP/antumi-home"
          ELECTRON_RUN_AS_NODE=1 timeout 10 "$exe" resources/backend/daemon.mjs & pid=$!
          sleep 6
          kill -0 $pid
          ls -la "$ANTUMI_HOME"
          kill $pid || true
      - name: Inspect deb
        run: echo "::warning title=maintainer::$(dpkg-deb --field packages/desktop/dist/*.deb Maintainer)" && dpkg-deb --info packages/desktop/dist/*.deb && dpkg-deb --contents packages/desktop/dist/*.deb | grep -E 'chrome-sandbox|node-pty|pty.node'
      - uses: actions/upload-artifact@v7
        with:
          name: antumi-linux
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
