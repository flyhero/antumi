appId: dev.antumi.desktop
productName: Antumi
directories:
  output: dist
# Everything the renderer and main need is compiled into out/; the backend ships as plain files
# under Resources/backend instead, where forked Node processes can read them (asar cannot be).
files:
  - out/**
  - '!out/backend/**'
# node-pty is named directly: a from under a node_modules path sidesteps the matcher's
# built-in node_modules exclusion, which silently dropped it from backend/.
extraResources:
  - from: out/backend
    to: backend
    filter: ['*.mjs']
  - from: out/backend/plugins
    to: backend/plugins
  - from: out/backend/node_modules/node-pty
    to: backend/node_modules/node-pty
# All native code arrives prebuilt (node-pty via bundle-backend); nothing to rebuild.
npmRebuild: false
# With no certificate the mac app would ship a broken signature and get no system notifications.
afterPack: scripts/mac-adhoc-sign.mjs
mac:
  category: public.app-category.developer-tools
  # From docs/branding/antumi-icon-agent-blocks-3d.png, laid on macOS's icon grid: an 824px rounded square on a
  # 1024px canvas, with room for its shadow.
  icon: build/icon.png
  # Every installer is named <version>-<os>-<arch>, so a download says which system it is for. The
  # name must keep ending in -<arch>.<ext>: installed versions pick their update by that ending.
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
win:
  # The same artwork without macOS's grid margin and shadow: Windows draws icons edge to edge, and
  # the 824px plate on a 1024px canvas showed a fifth smaller than its neighbours on the taskbar.
  # electron-builder makes the .ico from it.
  icon: build/icon-win.png
  target:
    - target: nsis
      arch:
        - x64
# Per user, under %LOCALAPPDATA%\Programs, like the agents' own CLIs: no administrator needed.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
# AppImage runs without installing; the deb sets up chrome-sandbox, which Electron needs where
# unprivileged user namespaces are off (Ubuntu 23.10 and later). Built on Linux: see bundle-backend.
linux:
  executableName: antumi
  icon: build/icon-win.png
  category: Development
  maintainer: flyhero
  synopsis: Task-first multi-agent manager
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
