plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.antumi.push'
version = '0.0.0'

android {
  namespace 'app.antumi.push'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

dependencies {
  implementation 'org.unifiedpush.android:connector:3.3.6'
  implementation 'androidx.core:core:1.17.0'
}
